[package]
name = "gdl"
version = "0.0.3"
edition = "2021"
authors = [ "Austin Davis-Richardson <hello@agdr.org>" ]
license = "MIT"
repository = "https://github.com/audy/gdl"
description = "CLI to quickly fetch genome assemblies from NCBI"

[dependencies]
clap = { version = "4.5.19", features = ["derive"] }
csv = "1.3.0"
flate2 = { version = "1.0.34", default-features = false, features = ["rust_backend"] }
futures = "0.3.30"
indicatif = "0.17.8"
rayon = "1.10.0"
reqwest = { version = "0.12.8", features = ["blocking", "native-tls-vendored"] }
arrow = { version = "53", default-features = false }
parquet = { version = "53", features = ["arrow"] }
serde = "1.0.210"
tar = "0.4.42"
taxonomy = { path = "/Users/audy/Code/taxonomy" }

[dev-dependencies]
tempfile = "3.10.1"
httpmock = "0.7.0"
